[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pycombo"
version = "1.2.0"
description = "Python wrapper around Combo network partitioning algorithm (C++)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Philipp", email = "casyfill@gmail.com" }]
requires-python = ">=3.9"
keywords = [
    "Networks",
    "Graph Theory",
    "Mathematics",
    "network",
    "graph",
    "discrete mathematics",
    "math",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Casyfill/pyCombo"
"Bug Tracker" = "https://github.com/Casyfill/pyCombo/issues"
"Source Code" = "https://github.com/Casyfill/pyCombo"

[dependency-groups]
dev = [
    "numpy>=1.26",
    "scipy>=1.13.1",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.5.2",
    "pytest>=7.1.2",
    "networkx>=3.1",
    "igraph>=0.11.6",
    "leidenalg>=0.10.2",
    "cdlib>=0.4.0",
    "python-louvain>=0.16",
    "pytest-benchmark>=3.2.3",
    "pytest-cov>=2.10.1",
    "flake8>=6.1.0",
    "black>=22.3",
    "pre-commit>=2.19.0",
    "ipykernel>=6.29.5",
    "tqdm>=4.66.5",
    "cibuildwheel>=2.22",
]

[tool.scikit-build]
wheel.packages = ["pycombo"]
sdist.include = ["src/Combo/**", "src/Binder.cpp", "CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
build-frontend = "build[uv]"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
